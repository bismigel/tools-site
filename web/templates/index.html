{{define "content"}}
<header class="page-header">
  <h1 class="page-title">Tools</h1>
  <p class="page-subtitle">Small utilities with one job each. No account, no tracking, and every page works without JavaScript.</p>
</header>

<div class="article-list">
  {{range .Tools}}
  <article>
    <a class="tool-card" href="/t/{{.Name}}">
      <div class="tools-card-body">
        <h2 class="tool-card-title">{{.DisplayName}}</h2>
        <p class="tool-card-summary">{{.Summary}}</p>
        <span class="tool-card-cta">Open</span>
      </div>
    </a>
  </article>
  {{else}}
  <article><div class="tools-card-body"><p>No tools yet.</p></div></article>
  {{end}}
</div>

<p class="page-note">Machines can use the same tools — <a href="/api/tools">/api/tools</a> is the manifest.</p>
{{end}}
