{{define "content"}}
<section class="tools-card">
  <h2 class="section-title">{{.Tool.Name}}</h2>
  <p>{{.Tool.Summary}}</p>
  {{template "form" .}}
</section>

<section class="tools-card">
  <h2 class="section-title">Result</h2>
  <div id="result" aria-live="polite">
    {{if .Result}}{{template "result" .}}{{end}}
  </div>
</section>
{{end}}
