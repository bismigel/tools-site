{{define "layout"}}<!DOCTYPE html>
<html lang="en" data-scheme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if and .Title (ne .Title .SiteName)}}{{.Title}} · {{end}}{{.SiteName}}</title>
  <meta name="description" content="{{.Description}}">
  <link rel="icon" href="/static/img/avatar.svg" type="image/svg+xml">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <link rel="stylesheet" href="/static/css/tools.css">
  <script src="/static/js/scheme.js" defer></script>
  <script src="/static/js/htmx.min.js" defer></script>
  <script src="/static/js/webmcp.js" defer></script>
  {{if .Dev}}<script src="/static/js/dev.js" defer></script>{{end}}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="container main-container flex on-phone--column extended">
    <aside class="sidebar left-sidebar sticky">
      <header>
        <figure class="site-avatar">
          <a href="/"><img class="site-logo" src="/static/img/avatar.svg" alt="" width="96" height="96"></a>
        </figure>
        <div class="site-meta">
          <!-- A page has one h1; that is the tool or page title below, not the brand. -->
          <p class="site-name"><a href="/">{{.SiteName}}</a></p>
          <h2 class="site-description">{{.SiteDesc}}</h2>
        </div>
      </header>

      <nav class="tools-nav" aria-label="Main">
        <a href="/">Tools</a>
        <a href="/api/tools">API</a>
        <button id="scheme-toggle" type="button" title="Toggle dark mode">Theme</button>
      </nav>

      <footer class="site-footer">
        <span>© {{.Year}} {{.SiteName}}</span>
      </footer>
    </aside>

    <main class="main full-width" id="main">
      {{template "content" .}}
    </main>
  </div>
</body>
</html>{{end}}
