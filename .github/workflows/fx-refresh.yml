name: fx-refresh

on:
  schedule:
    # ECB publishes around 16:00 CET on working days; run after that.
    - cron: "45 16 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: fetch rates
        run: python3 scripts/fx-refresh.py

      - name: commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- internal/fx/rates.json; then
            echo "rates unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add internal/fx/rates.json
          git commit -m "data(fx): ECB reference rates $(date -u +%Y-%m-%d)"
          git push
