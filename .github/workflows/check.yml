name: check

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Same versions as the dev shell, pinned so a green local run means a green PR.
      - name: install dart-sass + govulncheck
        run: |
          npm install --global sass@1.107.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: browser for the E2E suite
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # The dev shell provides these; a runner does not. Pinned, because
      # `make manifests` must behave the same here as on a laptop.
      - name: install kustomize + kubeconform
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin kustomize
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform
          kustomize version --short
          kubeconform -v

      # One definition of "CI passes": the same script a developer runs as `make ci`.
      - name: make ci
        run: make ci

      - name: image builds
        run: make image
