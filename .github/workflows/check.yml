name: check

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Same versions as the dev shell, pinned so a green local run means a green PR.
      - name: install dart-sass + govulncheck
        run: |
          npm install --global sass@1.107.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      # One definition of "CI passes": the same script a developer runs as `make ci`.
      - name: make ci
        run: make ci

      - name: image builds
        run: make image
