name: release

on:
  push:
    branches: [main]
    # Without this, merging the image-bump PR starts another release, which opens
    # another bump PR, forever. Learned from homelab-app-template.
    paths-ignore:
      - "deploy/**"
      - "docs/**"
      - "**.md"
      - "theme/tools.css"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - id: tag
        name: compute tag
        run: |
          # A version tag, not a moving one. The digest is what actually pins code;
          # the tag is for humans reading `docker images`.
          echo "value=v0.1.0-main.$(date -u +%Y%m%d%H%M%S).${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        id: push
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          make image IMAGE="$IMAGE"
          docker push "$IMAGE" | tee /tmp/push.txt
          DIGEST=$(grep -oE 'digest: sha256:[a-f0-9]+' /tmp/push.txt | head -1 | awk '{print $2}')
          if [ -z "${DIGEST:-}" ]; then
            DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | sed 's/.*@//')
          fi
          test -n "$DIGEST"
          # Prove the registry serves that exact digest before writing it to git.
          docker manifest inspect "ghcr.io/${{ github.repository }}@${DIGEST}" >/dev/null
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # The digest is the pin. A tag alone can be repointed at different code, so
      # this is the only thing that keeps deploy/k8s honest — and the only writer
      # of that line (selfHeal reverts any human edit).
      - name: open digest-bump PR
        if: ${{ hashFiles('deploy/k8s/deployment.yaml') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i -E "s#image: ghcr\.io/[^ ]+/tools-site[^ ]*#image: ghcr.io/${GITHUB_REPOSITORY}:${TAG}@${DIGEST}#" \
            deploy/k8s/deployment.yaml
          git diff --exit-code -- deploy/k8s/deployment.yaml && {
            echo "image line already at ${TAG}@${DIGEST}; nothing to do"
            exit 0
          }
          branch="bump-image-${TAG}"
          git checkout -b "$branch"
          git commit -am "deploy: pin tools-site to ${TAG}@${DIGEST}"
          git push origin "$branch"

          # A repo setting can forbid GITHUB_TOKEN from opening PRs. That is not a
          # release failure: the image is published and the branch is pushed, so
          # warn with the compare URL and stay green. Enabling
          # Settings -> Actions -> General -> "Allow GitHub Actions to create and
          # approve pull requests" restores full automation.
          if ! gh pr create \
            --title "deploy: pin tools-site to ${TAG}" \
            --body "Automated by release.yml.

          Image: \`ghcr.io/${GITHUB_REPOSITORY}:${TAG}\`
          Digest: \`${DIGEST}\`

          The digest is the pin; the tag is only a label." \
            --base main --head "$branch"; then
            echo "::warning::could not open the PR; branch ${branch} is pushed"
            echo "Open: https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          fi
