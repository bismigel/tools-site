name: release

on:
  push:
    branches: [main]
    # Without this, merging the image-bump PR starts another release, which opens
    # another bump PR, forever. Learned from homelab-app-template.
    paths-ignore:
      - "deploy/**"
      - "docs/**"
      - "**.md"
      - "theme/tools.css"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - id: tag
        name: compute tag
        run: |
          # A version tag, not a moving one. The digest is what actually pins code;
          # the tag is for humans reading `docker images`.
          echo "value=v0.1.0-main.$(date -u +%Y%m%d%H%M%S).${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        id: push
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          make image IMAGE="$IMAGE"
          docker push "$IMAGE" | tee /tmp/push.txt
          DIGEST=$(grep -oE 'digest: sha256:[a-f0-9]+' /tmp/push.txt | head -1 | awk '{print $2}')
          if [ -z "${DIGEST:-}" ]; then
            DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | sed 's/.*@//')
          fi
          test -n "$DIGEST"
          # Prove the registry serves that exact digest before writing it to git.
          docker manifest inspect "ghcr.io/${{ github.repository }}@${DIGEST}" >/dev/null
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # The digest is the pin. A tag alone can be repointed at different code, so
      # this is the only thing that keeps deploy/k8s honest — and the only writer
      # of that line (selfHeal reverts any human edit).
      - name: open digest-bump PR
        if: ${{ hashFiles('deploy/k8s/deployment.yaml') != '' }}
        env:
          # A user token from Bitwarden (repo + workflow), not GITHUB_TOKEN:
          # a push made with GITHUB_TOKEN does not trigger workflows, and this repo
          # forbids GITHUB_TOKEN from creating pull requests. With BUMP_TOKEN the
          # push is an ordinary user push, so the PR gets its checks, and the PR
          # can be opened automatically.
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::BUMP_TOKEN is not set: image published, pin not updated"
            echo "Add the 'github-pat' secret from Bitwarden as BUMP_TOKEN."
            exit 0
          fi

          git config user.name  "bismigel"
          git config user.email "bismigel@pm.me"
          sed -i -E "s#image: ghcr\.io/[^ ]+/tools-site[^ ]*#image: ghcr.io/${GITHUB_REPOSITORY}:${TAG}@${DIGEST}#" \
            deploy/k8s/deployment.yaml
          if git diff --exit-code -- deploy/k8s/deployment.yaml; then
            echo "image line already at ${TAG}@${DIGEST}; nothing to do"
            exit 0
          fi

          branch="bump-image"
          git checkout -B "$branch"
          git commit -am "deploy: pin tools-site to ${TAG}@${DIGEST}"
          # Push as the token's owner, not as github-actions[bot].
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "$branch"

          body="Automated by release.yml.

          Image: \`ghcr.io/${GITHUB_REPOSITORY}:${TAG}\`
          Digest: \`${DIGEST}\`

          The digest is the pin; the tag is only a label. This branch is force-pushed
          on every release, so this PR refreshes rather than being superseded."

          existing=$(gh pr list --head "$branch" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
            echo "refreshed PR #${existing}"
            exit 0
          fi
          gh pr create --title "deploy: pin tools-site to ${TAG}" --body "$body" \
            --base main --head "$branch"
