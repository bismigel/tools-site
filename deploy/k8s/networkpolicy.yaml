apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tools-site
  labels:
    app: tools-site
spec:
  podSelector:
    matchLabels:
      app: tools-site
  policyTypes: [Ingress, Egress]
  ingress:
    # Only the ingress controller and monitoring may reach the app. Other pods in
    # `apps` are blocked here — but note that a NetworkPolicy is namespaced, so the
    # in-process JWT check remains the real control for the gated zone.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  # Empty egress: with Egress in policyTypes and no rules, all outbound traffic is
  # denied. This app makes no outbound request at all — FX rates are build-time
  # data (ADR-0009), tzdata is embedded — so it does not even need DNS, and a DNS
  # concession would be a hole with no reader. A future fetching tool needs an ADR,
  # a guarded client and a named destination here (spec FR-1.9).
  egress: []
