apiVersion: apps/v1
kind: Deployment
metadata:
  name: tools-site
  labels:
    app: tools-site
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: tools-site
  template:
    metadata:
      labels:
        app: tools-site
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: tools-site
      containers:
        - name: tools-site
          # Owned by release.yml — never hand-edit this line (AGENTS.md rule 2).
          # This tag is a placeholder until the first release. Do not register the
          # ArgoCD Application before the bump PR lands, or the first sync is
          # ErrImagePull: docs/checklists/edge.md §0.
          image: ghcr.io/bismigel/tools-site:main-00000000-000000-0000000
          imagePullPolicy: IfNotPresent
          args: ["-base-url=https://tools.ciceley.cc"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tools-site
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
