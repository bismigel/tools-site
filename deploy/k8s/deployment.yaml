apiVersion: apps/v1
kind: Deployment
metadata:
  name: tools-site
  labels:
    app: tools-site
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: tools-site
  template:
    metadata:
      labels:
        app: tools-site
      annotations:
        # The binary serves a hand-rolled Prometheus exposition on /metrics; the
        # estate scrapes pods by annotation, not by ServiceMonitor.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      # The app drains in-flight requests for up to 10s on SIGTERM; give it room
      # to finish before the kubelet sends SIGKILL.
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # restricted: seccomp at pod level, no privilege escalation, all caps
        # dropped at container level. No volumes at all, so no fsGroup needed.
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: tools-site
      containers:
        - name: tools-site
          # CI owns this line (AGENTS.md rule 2, spec NFR-5.5). release.yml pushes
          # <tag> and rewrites the line as "<tag>@sha256:<digest>", because a tag
          # alone can be repointed at different code.
          #
          # The digest below is a PLACEHOLDER: nothing has been published yet, so
          # the first sync of this Deployment is ImagePullBackOff until the
          # image-bump PR lands. See docs/checklists/edge.md §0 before enabling
          # the Application.
          image: ghcr.io/bismigel/tools-site:v0.1.0-main.20261114194756.1a3f9d7@sha256:7c4e73c62d1fb872d4e300dac24fd638477697dc1dae02f23ad7c884a1b20c85
          imagePullPolicy: IfNotPresent
          args: ["-base-url=https://tools.ciceley.cc"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tools-site
          # Liveness proves the process answers and touches nothing else; readiness
          # proves the app can actually serve (registry built, templates and CSS
          # loaded). "/readyz is not /healthz" — docs/context/homelab.md.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Proportionate to a Go binary that renders templates and does no network
          # I/O: 32Mi request covers steady state (measured binary ~14 MiB, heap a
          # few MiB); 96Mi limit is the spec's NFR-1.6 ceiling, and 500m CPU matches
          # the estate's other app so a burst (template render, 24-row grid) is not
          # throttled by an arbitrarily low limit.
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      # No volumes: the binary embeds templates, static assets, the FX data and
      # tzdata, and writes nothing. Nothing here is worth an emptyDir, let alone a PVC.
